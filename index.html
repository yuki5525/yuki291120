<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#7c3aed" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="钰琦的记账本" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
<link rel="preload" as="image" href="./avatar.png" />
<title>钰琦的记账本 · PWA</title>
<style>
:root{
  --bg:#08080b; --bg-2:#0e0d14;
  --surface:rgba(40,38,54,0.45); --surface-2:rgba(54,50,72,0.55);
  --border:rgba(124,58,237,0.22); --border-strong:rgba(124,58,237,0.45);
  --text:#e9e7f2; --muted:#9b97ad;
  --primary:#7c3aed; --primary-soft:rgba(124,58,237,0.16);
  --gray:#b9b6c6;
  --income:#5ed1a8;        /* 收入=绿 */
  --expense:#ff6b6b;       /* 支出=红 */
  --warn:#ff5c5c; --ok:#4ade80;
  --radius:16px; --radius-sm:10px;
  --shadow:0 8px 30px rgba(0,0,0,0.45);
  --sidebar-w:168px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 600px at 12% -10%, rgba(124,58,237,0.18), transparent 60%),
             radial-gradient(900px 500px at 110% 10%, rgba(80,70,140,0.16), transparent 55%),
             var(--bg);
  color:var(--text); min-height:100vh; font-size:14px; -webkit-font-smoothing:antialiased;
}
.hidden{display:none !important}
.muted{color:var(--muted)} .tiny{font-size:11px}
.glass{background:var(--surface); backdrop-filter:blur(14px) saturate(120%); -webkit-backdrop-filter:blur(14px) saturate(120%); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}

/* ===== 顶层状态栏：日期 / 时间 / 星期 / 农历 ===== */
#statusBar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:8px 14px; font-size:12.5px;
  background:rgba(10,9,15,0.78); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  font-variant-numeric:tabular-nums;
}
#statusBar .left{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
#statusBar .right{display:flex; align-items:center; gap:10px}
#statusBar .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; background:var(--primary-soft); border:1px solid var(--border); color:#cbb6ff}
#statusBar .time{color:#fff; font-weight:700; letter-spacing:.5px; min-width:64px; text-align:center}
#statusBar .lunar{color:#ffd28a}

/* ===== 布局 ===== */
#app{display:flex; min-height:calc(100vh - 40px)}
#sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
  background:linear-gradient(180deg, rgba(20,18,28,0.9), rgba(12,11,18,0.9));
  border-right:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center;
  padding:14px 8px; gap:10px; position:sticky; top:40px; height:calc(100vh - 40px);
}
.brand{display:flex; align-items:center; gap:8px; padding:6px 4px 12px; width:100%; justify-content:center}
.brand-logo{font-size:24px; filter:drop-shadow(0 0 8px rgba(124,58,237,.6))}
.brand-text{font-weight:700; line-height:1.1; font-size:13px; letter-spacing:.5px}
.nav-list{list-style:none; margin:0; padding:0; width:100%; display:flex; flex-direction:column; gap:4px; overflow-y:auto; flex:1}
.nav-item{width:100%; display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:var(--radius-sm); border:1px solid transparent; background:transparent; color:var(--gray); cursor:pointer; font-size:13.5px; text-align:left; transition:.18s}
.nav-item .ic{font-size:17px; width:20px; text-align:center}
.nav-item:hover{background:var(--primary-soft); color:var(--text)}
.nav-item.active{background:linear-gradient(90deg, rgba(124,58,237,.32), rgba(124,58,237,.08)); border-color:var(--border-strong); color:#fff; box-shadow:0 0 0 1px rgba(124,58,237,.25) inset}
.nav-foot{width:100%; display:flex; justify-content:center; padding-top:8px; border-top:1px solid var(--border); gap:6px}
.nav-foot .nav-item{width:auto; padding:9px 10px}

#content{flex:1; min-width:0; display:flex; flex-direction:column}
#topbar{position:sticky; top:40px; z-index:20; display:flex; align-items:center; gap:12px; padding:12px 18px; background:rgba(10,9,15,0.55); backdrop-filter:blur(10px); border-bottom:1px solid var(--border)}
#pageTitle{margin:0; font-size:18px; font-weight:700; flex:1}
#menuToggle{display:none}
.top-actions{display:flex; gap:8px; align-items:center}

.view{padding:18px; max-width:1100px; width:100%; margin:0 auto}

/* ===== 按钮 ===== */
.primary-btn{background:linear-gradient(135deg,var(--primary),#5b2bb0); color:#fff; border:none; border-radius:var(--radius-sm); padding:10px 16px; font-weight:600; cursor:pointer; font-size:13.5px; box-shadow:0 4px 14px rgba(124,58,237,.35); transition:.15s}
.primary-btn:hover{filter:brightness(1.08); transform:translateY(-1px)}
.primary-btn.block{width:100%; padding:13px}
.ghost-btn{background:transparent; border:1px solid var(--border); color:var(--gray); border-radius:var(--radius-sm); padding:9px 12px; cursor:pointer; font-size:13px}
.ghost-btn:hover{color:#fff; border-color:var(--border-strong)}
.danger-btn{background:rgba(255,92,92,.14); border:1px solid rgba(255,92,92,.4); color:var(--warn); border-radius:var(--radius-sm); padding:9px 12px; cursor:pointer}
.btn-sm{padding:7px 11px; font-size:12px; border-radius:8px}

/* ===== 警告横幅 ===== */
.warn-banner{padding:14px 16px; margin-bottom:12px; border-radius:var(--radius); border:1px solid rgba(255,140,60,.45); background:linear-gradient(90deg, rgba(255,140,60,.12), rgba(255,92,92,.08)); display:flex; gap:12px; align-items:flex-start}
.warn-banner .icon{font-size:20px; line-height:1.2}
.warn-banner .text{font-size:12.5px; line-height:1.6; color:#ffe1c2}
.warn-banner strong{color:#ffb37a}

/* ===== 卡片网格 ===== */
.grid{display:grid; gap:14px}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px}
.card{padding:16px}
.card .label{color:var(--muted); font-size:12.5px; margin-bottom:8px; display:flex; align-items:center; gap:6px}
.card .value{font-size:24px; font-weight:800; letter-spacing:.3px}
.card .sub{font-size:11.5px; color:var(--muted); margin-top:6px}
.value.income{color:var(--income)} .value.expense{color:var(--expense)} .value.warn{color:var(--warn)}
/* 账户透支：余额<0 红字 + ⚠️ */
.bal-neg{color:var(--warn)!important}
.total-asset{background:linear-gradient(135deg, rgba(124,58,237,.18), rgba(20,18,28,.9))}
.total-asset.bal-neg{box-shadow:0 0 0 1px var(--warn), 0 6px 20px rgba(255,92,92,.25)}

/* ===== 表单 ===== */
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:12.5px; color:var(--muted)}
input,select,textarea{background:rgba(20,18,28,0.7); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); padding:11px 12px; font-size:14px; width:100%; outline:none; transition:.15s; font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--border-strong); box-shadow:0 0 0 3px rgba(124,58,237,.18)}
textarea{resize:vertical; min-height:60px}
.amount-input-wrap{position:relative}
.amount-input-wrap .rm{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--primary); font-weight:700; pointer-events:none}
.amount-input-wrap input{padding-left:34px; font-variant-numeric:tabular-nums; font-weight:700}
.pos-hint{font-size:10.5px; color:var(--muted)}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
.section-title{font-size:15px; font-weight:700; margin:22px 0 12px; display:flex; align-items:center; gap:8px}
.divider{height:1px; background:var(--border); margin:18px 0}
.badge{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; background:var(--primary-soft); color:#cbb6ff; border:1px solid var(--border-strong)}
.badge.gray{background:rgba(150,150,160,.12); color:var(--gray); border-color:rgba(150,150,160,.25)}
.badge.warn{background:rgba(255,92,92,.14); color:var(--warn); border-color:rgba(255,92,92,.4)}
.badge.ok{background:rgba(74,222,128,.14); color:var(--ok); border-color:rgba(74,222,128,.4)}
.filter-tag{display:inline-block; padding:2px 10px; border-radius:999px; font-size:11px; font-weight:600; background:var(--primary-soft); color:#cbb6ff; border:1px solid var(--border-strong); letter-spacing:.3px}
.kpi-row-head{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap}
.kpi-title{font-size:14px; font-weight:700; display:inline-flex; align-items:center; gap:6px; margin:0}
.kpi-badge{display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:500; background:var(--surface-2); border:1px solid var(--border); color:var(--muted); font-variant-numeric:tabular-nums}

/* ===== 表格 ===== */
.table-wrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border)}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:760px}
th,td{padding:11px 12px; text-align:left; border-bottom:1px solid rgba(124,58,237,.12); white-space:nowrap}
th{color:var(--muted); font-weight:600; background:rgba(124,58,237,.06); position:sticky; top:0}
tbody tr:hover{background:rgba(124,58,237,.06)}
td.num{text-align:right; font-variant-numeric:tabular-nums; font-weight:700}
.tag-income{color:var(--income)} .tag-expense{color:var(--expense)}
.link-btn{color:#cbb6ff; cursor:pointer; background:none; border:none; font-size:12.5px; padding:4px 6px}
.link-btn:hover{text-decoration:underline}

/* ===== 原生日期选择器 & 选中后日期信息行 ===== */
input[type="date"]{background:rgba(255,255,255,.04); border:1px solid var(--border); color:#fff; border-radius:var(--radius-sm); padding:9px 11px; font-size:13.5px; font-family:inherit}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.7); cursor:pointer}
input[type="date"]::-webkit-datetime-edit{color:#fff}
input[type="date"]:focus{outline:none; border-color:var(--primary)}
.date-info-row{margin:-4px 0 6px; font-size:12.5px}
.date-info{color:var(--muted)}
.date-info b{color:#fff; font-variant-numeric:tabular-nums}
.date-info .lunar{color:#ffd28a}

/* ===== 记账明细：筛选/导出栏常驻顶部（不被列表滚走） ===== */
.r-filterbar{position:sticky; top:84px; z-index:15; margin-bottom:14px;
  background:linear-gradient(180deg, rgba(20,18,28,.97), rgba(16,14,22,.97));
  backdrop-filter:blur(8px); border:1px solid var(--border); box-shadow:0 6px 18px rgba(0,0,0,.35)}

/* ===== 弹窗 ===== */
.modal-root{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center}
.modal-mask{position:absolute; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(3px)}
.modal-box{position:relative; width:min(560px,92vw); max-height:88vh; overflow:auto; padding:18px}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.modal-head h3{margin:0}

/* ===== 头像（静态，不上传、不入 IndexedDB） ===== */
.avatar{
  display:inline-block;
  width:56px; height:56px; border-radius:50%;
  background:#1a1726 url('./avatar.png') center/cover no-repeat;
  border:2px solid var(--border-strong);
  box-shadow:0 0 0 2px rgba(124,58,237,.18), 0 4px 14px rgba(0,0,0,.4);
  flex:0 0 auto;
}
.avatar.sm{width:28px; height:28px; border-width:1.5px; box-shadow:0 0 0 1.5px rgba(124,58,237,.16), 0 2px 6px rgba(0,0,0,.35)}
.avatar.lg{width:96px; height:96px; border-width:3px; box-shadow:0 0 0 3px rgba(124,58,237,.22), 0 8px 24px rgba(0,0,0,.45)}

/* ===== 锁屏 ===== */
.lock-screen{position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; background:radial-gradient(800px 500px at 50% 0%, rgba(124,58,237,.22), transparent 60%), #06060a}
.lock-card{width:min(360px,90vw); padding:30px 24px; text-align:center}
.lock-card .lock-logo{display:flex; justify-content:center; margin-bottom:14px}
.lock-card h2{margin:6px 0 4px}
.lock-card input{text-align:center; font-size:18px; letter-spacing:6px; margin:14px 0}

/* ===== 日历 ===== */
.cal-head{display:flex; align-items:center; justify-content:space-between; margin:14px 0 12px; gap:10px; flex-wrap:wrap}
.cal-nav{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.cal-nav strong{margin:0 6px; font-size:15px; color:var(--text); letter-spacing:.3px}
.cal-topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.cal-views button{min-width:64px}
.cal-period-badge{font-size:11.5px; font-weight:400; background:var(--surface-2); border:1px solid var(--border); padding:3px 10px; border-radius:999px; margin-left:8px; color:var(--muted)}
.cal-stat-kpi{margin-top:6px}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.cal-cell{border:1px solid var(--border); border-radius:10px; padding:8px 6px; min-height:62px; cursor:pointer; background:rgba(20,18,28,.4); transition:.12s; display:flex; flex-direction:column; justify-content:space-between}
.cal-cell:hover{border-color:var(--border-strong); background:rgba(124,58,237,.1)}
.cal-cell.other{opacity:.35}
.cal-cell.today{border-color:var(--primary); box-shadow:0 0 0 1px var(--primary) inset}
.cal-cell .d{font-size:12px; color:var(--muted)}
.cal-cell .amt{font-size:10.5px; line-height:1.35}
.cal-cell .amt .i{color:var(--income)} .cal-cell .amt .e{color:var(--expense)}
.cal-week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px}
.cal-week div{text-align:center; font-size:11px; color:var(--muted); padding:4px}
.cal-year{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.cal-month{border:1px solid var(--border); border-radius:12px; padding:12px; cursor:pointer; background:rgba(20,18,28,.4); transition:.12s}
.cal-month:hover{border-color:var(--border-strong); background:rgba(124,58,237,.1)}
.cal-month .m{font-weight:700; margin-bottom:6px}
.cal-month .amt{font-size:11px}

/* ===== 进度条 ===== */
.bar{height:8px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden}
.bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--primary),#a06bff)}
.bar > i.over{background:linear-gradient(90deg,#ff5c5c,#ff8a8a)}

/* ===== 底部导航（移动端） ===== */
#bottomNav{display:none}

@media (max-width:760px){
  :root{--sidebar-w:0px}
  #sidebar{position:fixed; left:0; top:40px; bottom:0; width:230px; z-index:60; transform:translateX(-100%); transition:.22s; height:calc(100vh - 40px)}
  #sidebar.open{transform:translateX(0)}
  #menuToggle{display:block}
  #topbar{top:40px}
  .view{padding:14px}
  #bottomNav{display:flex; position:fixed; bottom:0; left:0; right:0; z-index:50; background:rgba(10,9,15,.92); backdrop-filter:blur(12px); border-top:1px solid var(--border); justify-content:space-around; padding:6px 2px; padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  #bottomNav .nav-item{flex-direction:column; gap:2px; font-size:10px; padding:6px 4px; flex:1}
  #bottomNav .ic{font-size:18px}
  #content{padding-bottom:64px}
  .cards{grid-template-columns:repeat(2,1fr)}
  .value{font-size:21px}
  #statusBar{font-size:11.5px; padding:6px 10px}
  #statusBar .left{gap:8px}
}
.toast{position:fixed; left:50%; bottom:84px; transform:translateX(-50%); z-index:300; background:rgba(20,18,28,.96); border:1px solid var(--border-strong); color:#fff; padding:11px 18px; border-radius:999px; font-size:13px; box-shadow:var(--shadow); animation:pop .25s}
@keyframes pop{from{opacity:0; transform:translate(-50%,10px)} to{opacity:1; transform:translate(-50%,0)}}
.pill-row{display:flex; gap:8px; flex-wrap:wrap}
.seg{display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden}
.seg button{background:transparent; border:none; color:var(--gray); padding:7px 14px; cursor:pointer; font-size:12.5px}
.seg button.active{background:var(--primary-soft); color:#fff}
.empty{text-align:center; color:var(--muted); padding:40px 10px; font-size:13px}
.chart-box{position:relative; height:300px}
.kv{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed rgba(124,58,237,.15); font-size:13px}
.kv .k{color:var(--muted)} .kv .v{font-weight:700; font-variant-numeric:tabular-nums}
.member-stat{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid rgba(124,58,237,.12)}
.member-stat .av{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--primary-soft); font-size:17px}
</style>
</head>
<body>

<!--
=====================================================================
  ⚠️ F12 控制台应急脚本（HTML 注释中，使用时请复制粘贴到 Console）
  ① 完整备份（含记账记录 + 登录密码 + 配置 + 草稿）→ 下载 JSON
  ② 完整恢复（从 JSON 恢复记账记录 + 登录密码 + 配置 + 草稿）
  说明：页面「导出/导入」按钮只备份/恢复业务数据（不含密码）；
       控制台脚本是"全套"应急备份，密码也会一起带上/恢复。
=====================================================================

① 完整备份（复制以下整段到 Console，回车即可下载 full-backup-YYYY-MM-DD.json）：

(async()=>{
  const DB='fwDB', stores=['records','debts','accounts','budgets','parties'];
  const db=await new Promise((res,rej)=>{const r=indexedDB.open(DB);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
  const data={type:'full-backup', exportedAt:new Date().toISOString()};
  for(const s of stores){
    data[s]=await new Promise(res=>{try{const t=db.transaction(s,'readonly').objectStore(s).getAll();t.onsuccess=()=>res(t.result||[]);t.onerror=()=>res([]);}catch(e){res([]);}});
  }
  data.password=localStorage.getItem('fw_pwd')||'';
  data.config=localStorage.getItem('fw_cfg')||'';
  data.draft=localStorage.getItem('fw_draft')||'';
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='full-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  console.log('✅ 完整备份完成，记账',data.records.length,'条；密码'+(data.password?'已含':'为空')+'；请妥善保存文件');
})();

② 完整恢复（复制以下整段到 Console，回车选择上一步导出的 JSON 文件）：

(async()=>{
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f){console.log('未选择文件');return;}
    const data=JSON.parse(await f.text());
    if(data.type!=='full-backup'){alert('不是完整备份文件（缺少 type=full-backup 标识）');return;}
    if(!confirm('将覆盖当前全部数据（含密码），确定恢复吗？'))return;
    const DB='fwDB';
    const db=await new Promise(res=>{const r=indexedDB.open(DB);r.onsuccess=()=>res(r.result);r.onerror=()=>alert('无法打开数据库');});
    for(const s of ['records','debts','accounts','budgets','parties']){
      if(!data[s])continue;
      try{
        const tx=db.transaction(s,'readwrite');const os=tx.objectStore(s);os.clear();
        for(const r of data[s])os.put(r);
        await new Promise(res=>{tx.oncomplete=res;tx.onerror=res;});
      }catch(e){console.warn('恢复',s,'失败',e);}
    }
    if(data.password!==undefined && data.password!=='')localStorage.setItem('fw_pwd',data.password);
    if(data.config)localStorage.setItem('fw_cfg',data.config);
    if(data.draft)localStorage.setItem('fw_draft',data.draft);
    alert('恢复完成，请刷新页面使密码生效');
    location.reload();

/* 日期：统一 DD-MM-YYYY；dmyKey 用于区间比较（跨年正确） */
function pad2(n){return String(n).padStart(2,'0');}
function todayDMY(){const d=new Date();return pad2(d.getDate())+'-'+pad2(d.getMonth()+1)+'-'+d.getFullYear();}
function dmyKey(s){
  s=String(s||'').trim();
  let m=s.match(/^(\d{2})-(\d{2})-(\d{4})$/); if(m) return m[3]+m[2]+m[1];
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+m[2]+m[3];
  return '';
}
function dmyAddDays(dmy,n){
  const m=String(dmy).match(/^(\d{2})-(\d{2})-(\d{4})$/); if(!m) return dmy;
  const d=new Date(+m[3],+m[2]-1,+m[1]); d.setDate(d.getDate()+n);
  return pad2(d.getDate())+'-'+pad2(d.getMonth()+1)+'-'+d.getFullYear();
}
function dmyToDate(dmy){const m=String(dmy).match(/^(\d{2})-(\d{2})-(\d{4})$/);return m?new Date(+m[3],+m[2]-1,+m[1]):null;}
function monthRangeDMY(y,mo){
  const start=pad2(1)+'-'+pad2(mo)+'-'+y, end=pad2(new Date(y,mo,0).getDate())+'-'+pad2(mo)+'-'+y;
  return {start,end};
}
function weekRangeOf(dmy){
  const d=dmyToDate(dmy)||new Date(); const day=(d.getDay()+6)%7; // 周一为0
  const mon=dmyAddDays(todayDMY()===dmy?todayDMY():(function(){const x=new Date(d);return pad2(x.getDate())+'-'+pad2(x.getMonth()+1)+'-'+x.getFullYear();})(),-day);
  return {start:mon, end:dmyAddDays(mon,6)};
}
const WEEK_CN=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

/* 原生日期选择器：内部统一 DD-MM-YYYY，input[type=date] 用 YYYY-MM-DD */
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function dmyToISO(dmy){const m=String(dmy||'').match(/^(\d{2})-(\d{2})-(\d{4})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:'';}
function isoToDmy(iso){const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:'';}
// 把任意存储日期(DD-MM-YYYY 或 YYYY-MM-DD)转成原生 date 控件能用的 YYYY-MM-DD
function anyToISO(s){return dmyToISO(s)|| (String(s||'').match(/^\d{4}-\d{2}-\d{2}/)?s:'');}
// 选中日期后同步展示「公历 / 星期 / 农历」，与首页状态栏风格一致
function dateInfoHTML(dmy){

  }catch(e){}
  return `<span class="date-info"><b>${dmy}</b> · ${WEEK_CN[d.getDay()]} · <span class="lunar">${lunar}</span></span>`;
}

function fmtRM(n){const v=Number(n||0);return 'RM '+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtNum(n){return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function uid(){return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function opt(arr,sel){return (arr||[]).map(x=>`<option value="${esc(x)}" ${String(sel||'')===String(x)?'selected':''}>${esc(x)}</option>`).join('');}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

/* ---------- IndexedDB ---------- */
const DB_NAME='fwDB', DB_VER=2;
let _db=null;
function openDB(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=()=>{
      const db=req.result;
      for(const s of ['records','debts','accounts','budgets','parties']){
        if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:'id'});
      }
      // v2 新增:小票图片(按 recordId 索引;一张图片对应一条流水)
      if(!db.objectStoreNames.contains('receipts')) db.createObjectStore('receipts',{keyPath:'recordId'});
    };
    req.onsuccess=()=>{_db=req.result;res(_db);};
    req.onerror=()=>rej(req.error);
  });
}
async function dbAll(store){const db=await openDB();return new Promise(res=>{const t=db.transaction(store,'readonly').objectStore(store).getAll();t.onsuccess=()=>res(t.result||[]);});}
async function dbPut(store,obj){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite').objectStore(store).put(obj);t.onsuccess=()=>res(obj);t.onerror=()=>rej(t.error);});}
async function dbDel(store,id){const db=await openDB();return new Promise(res=>{const t=db.transaction(store,'readwrite').objectStore(store).delete(id);t.onsuccess=res;});}
// 派生账户余额：期初余额 + 交易流水(收入+/支出-，按支付方式匹配账户；转账按 from/to 调两个账户)。
// 期初未录入按 0 计 → 始终能看到余额；可在「账户」页补录期初以修正。
function accountBalance(name){
  const acc=S.accounts.find(a=>a.name===name);
  if(!acc) return 0;
  let bal=Number(acc.opening)||0;
  for(const r of S.records){
    if(r.type==='transfer'){
      if(r.toAccount===name) bal+=Number(r.amount)||0;
      if(r.fromAccount===name) bal-=Number(r.amount)||0;
    } else if(r.payMethod===name){
      bal += (r.type==='income'? 1 : -1)*(Number(r.amount)||0);
    }
  }
  return Math.round(bal*100)/100;
}
function totalAssets(){
  let t=0;
  for(const a of S.accounts) t+=accountBalance(a.name);
  return Math.round(t*100)/100;
}
// 余额展示：<0 红字+⚠️；期初未设 → 小角标提示
function balText(name){
  const acc=S.accounts.find(a=>a.name===name);
  const b=accountBalance(name);
  const unset=!acc || acc.opening==null || acc.opening==='';
  return {text:fmtRM(b), neg:b<0, unset};
}

/* ---------- 状态 ---------- */
const S={records:[],debts:[],accounts:[],budgets:[],parties:[],ready:false};
async function loadAll(){
  S.records=await dbAll('records');
  S.debts=await dbAll('debts');
  S.accounts=await dbAll('accounts');
  S.budgets=await dbAll('budgets');
  S.parties=await dbAll('parties');
  if(S.accounts.length===0){
    S.accounts=LIB.accounts.map(a=>({id:uid(),name:a})); // opening 留空 → 派生余额按 0 起算
    for(const a of S.accounts)await dbPut('accounts',a);
  }
  // 兼容旧数据：把上一版存的 account.balance 迁移为 opening
  for(const a of S.accounts){
    if((a.opening==null||a.opening==='') && a.balance!=null && a.balance!==''){
      a.opening=a.balance; delete a.balance; await dbPut('accounts',a);
    }
  }
  // 兼容旧数据：补齐 Ryt Bank / GX Bank / PayLater
  for(const name of ['Ryt Bank','GX Bank','PayLater']){
    if(!S.accounts.find(a=>a.name===name)){const a={id:uid(),name};S.accounts.push(a);await dbPut('accounts',a);}
  }
  // 首次使用：种入示例 PayLater 债务，便于演示联动
  if(S.debts.length===0){
    const d={id:uid(),name:'Ryt PayLater',totalAmount:500,periods:0,weeklyPayment:0,monthlyPayment:0,
      paidPeriods:0,overduePeriods:0,paidAmount:0,startDate:todayDMY(),endDate:'',payMethod:'Ryt PayLater',status:'正常还款'};
    S.debts.push(d);await dbPut('debts',d);
  }
  S.ready=true;
}

/* ---------- 业务计算 ---------- */
const isPayLater=d=>/paylater/i.test(d.name||'');
function debtRemaining(d){return Math.max(0,(Number(d.totalAmount)||0)-(Number(d.paidAmount)||0));}
function flowRecords(){return S.records.filter(r=>r.type!=='transfer');}
function inRange(arr,startDMY,endDMY){const sk=dmyKey(startDMY),ek=dmyKey(endDMY);return arr.filter(r=>{const k=dmyKey(r.date);return k&&k>=sk&&k<=ek;});}
function sumIncome(){return flowRecords().filter(r=>r.dir==='in').reduce((a,r)=>a+r.amount,0);}
function sumExpense(){return flowRecords().filter(r=>r.dir==='out').reduce((a,r)=>a+r.amount,0);}

/* ---------- POS 金额输入 ---------- */
function bindAmountInput(input){
  // 用户输入什么就是什么(650 → 650;520000 → 520000;3.72 → 3.72)
  // 仅做展示格式化:整数不显示 .00,有小数才最多显示 2 位;不做 ÷100 / ÷1000 任何缩放。
  // 以 input 事件为唯一数据源 → 桌面/手机软键盘/粘贴/自动填充都能正确保留小数。
  let raw='';
  const reformat=()=>{
    if(raw===''||raw==='.'){ input.value=(raw==='.')?'0.':''; return; }
    if(raw.indexOf('.')>=0){ const [a,b]=raw.split('.'); input.value=a+'.'+(b||'').slice(0,2); }
    else input.value=raw;
  };
  const clean=(s)=>{
    s=String(s==null?'':s).replace(/[^0-9.]/g,'');
    const fd=s.indexOf('.');
    if(fd>=0) s=s.slice(0,fd+1)+s.slice(fd+1).replace(/\./g,''); // 只保留第一个小数点
    if(s.indexOf('.')>=0){ const m=s.match(/^(\d*)\.(\d{0,2})/); if(m) s=m[1]+'.'+m[2]; else { const p=s.indexOf('.'); s=s.slice(0,p+1)+(s.slice(p+1)||'').slice(0,2); } }
    return s;
  };
  input.readOnly=false;
  input.addEventListener('input',()=>{ raw=clean(input.value); if(input.value!==raw) input.value=raw; });
  input.addEventListener('blur',()=>{
    if(!raw||raw==='.'||raw==='0.'){ raw=''; input.value=''; return; }
    let [a,b]=raw.split('.');
    if(b!==undefined){ b=b.replace(/0+$/,''); raw=a+(b?'.'+b:''); }
    if(raw.endsWith('.')) raw=raw.slice(0,-1);
    reformat();
  });
  input.getAmount=()=>{ const n=parseFloat(raw); return isNaN(n)?0:n; };
  input.setAmount=(n)=>{ if(!n){raw='';input.value='';return;} const s=String(n); raw=s.indexOf('.')>=0?s.replace(/0+$/,'').replace(/\.$/,''):s; reformat(); };
}

  amtInput.setAmount(draft.amount||0);

  // ===== 拍照/上传图片 → OCR 填充 =====
  // 只把图片 Blob 暂存在 _pendingPhoto, 用户点「保存」时才写入 IndexedDB;
  // 不上传服务器,全部本地浏览器处理(Tesseract.js WASM 在本地跑).
  let _pendingPhoto=null;
  const ocrStatus=(m,on)=>{ const el=$('#q_ocrStatus'); if(!el) return; el.style.display=on?'block':'none'; el.textContent=m; };
  const showPreview=(blob)=>{
    if(!blob) return;
    _pendingPhoto=blob;
    const url=URL.createObjectURL(blob);
    const img=$('#q_img'); $('#q_preview').style.display='block';
    if(img.src) URL.revokeObjectURL(img.src);
    img.src=url;
  };
  const pickFile=(captureMode)=>{
    const f=$('#q_file');
    f.removeAttribute('capture'); // 上传:不带 capture → 走相册/文件
    if(captureMode==='camera') f.setAttribute('capture','environment');
    f.click();
  };
  $('#q_cam').onclick=()=>pickFile('camera');
  $('#q_up').onclick=()=>pickFile('file');
  $('#q_file').onchange=async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    if(!/^image\//.test(f.type)){ toast('请选择图片文件'); return; }
    showPreview(f);
    ocrStatus('🔍 OCR 识别中(本地处理,不联网)...',true);
    try{
      if(typeof Tesseract==='undefined'){
        ocrStatus('⚠️ Tesseract 未加载,只保留图片,字段不填充',true);
        return;
      }
      const r=await Tesseract.recognize(f,'eng',{logger:m=>{ if(m.status==='recognizing text') ocrStatus(`🔍 识别中 ${Math.round((m.progress||0)*100)}%`,true); }});
      fillFromOCR(r.data.text||'');
      ocrStatus('✅ 识别完成,请人工核对后保存',true);
    }catch(err){
      console.error(err);
      ocrStatus('⚠️ OCR 失败: '+(err&&err.message||err),true);
    }finally{
      e.target.value='';
    }
  };
  function fillFromOCR(text){
    if(!text) return;
    // 金额:抓最后一个「数字 + .数字」,或在 RM/RM/MYR 后
    const m=text.match(/(?:rm|myr|total|amount|grand\s*total)[^\d]{0,12}(\d{1,5}(?:\.\d{1,2})?)/i);
    let amt=null;
    if(m) amt=m[1];
    if(!amt){ const all=text.match(/\d{1,5}\.\d{2}/g)||[]; amt=all.length?all[all.length-1]:null; }
    if(amt) amtInput.setAmount(parseFloat(amt));
    // 日期:DD/MM/YYYY 或 DD-MM-YYYY 或 YYYY-MM-DD → 原生 date 控件用 ISO(YYYY-MM-DD)
    const dm=text.match(/(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
    if(dm){
      let d=dm[1].padStart(2,'0'),mo=dm[2].padStart(2,'0'),y=dm[3];
      if(y.length===2) y='20'+y;
      $('#q_date').value=`${y}-${mo}-${d}`;
      if($('#q_dateInfo')) $('#q_dateInfo').innerHTML=dateInfoHTML(`${d}-${mo}-${y}`);
    }else{
      const iso=text.match(/(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/);
      if(iso){ const v=`${iso[1]}-${iso[2].padStart(2,'0')}-${iso[3].padStart(2,'0')}`; $('#q_date').value=v; if($('#q_dateInfo')) $('#q_dateInfo').innerHTML=dateInfoHTML(isoToDmy(v)); }
    }
    // 备注:取 OCR第一行非数字行
    const firstLine=(text.split(/\r?\n/).find(l=>l.trim()&&!/^\d/.test(l.trim()))||'').trim().slice(0,60);
    if(firstLine && !$('#q_note').value) $('#q_note').value=firstLine;
  }

  function refreshCat(){
    const type=$('#q_type').value;
    const cats=type==='income'?LIB.incomeCats:LIB.expenseCats;
    $('#q_cat').innerHTML=opt(cats, draft.category&&cats.includes(draft.category)?draft.category:cats[0]);
    // 往来对象：收入显示
    $('#q_partyWrap').style.display=(type==='income')?'flex':'none';
    // 关联债务：支出时显示
    $('#q_debtWrap').style.display=(type==='expense')?'flex':'none';
  }
  refreshCat();
  $('#q_type').onchange=refreshCat;
  $('#q_cat').onchange=()=>{};

  $('#q_save').onclick=async()=>{
    const date=isoToDmy($('#q_date').value.trim())||todayDMY();
    if(!/^\d{2}-\d{2}-\d{4}$/.test(date)){toast('请选择日期');return;}
    const type=$('#q_type').value;
    const amount=amtInput.getAmount();
    if(!amount||amount<=0){toast('请输入金额');return;}
    const rec={id:uid(),date,type,dir:type==='income'?'in':'out',amount,
      category:$('#q_cat').value,item:$('#q_item').value,note:$('#q_note').value.trim(),location:$('#q_loc').value,
      party:$('#q_party').value.trim(),orderNo:$('#q_order').value.trim(),
      payMethod:$('#q_pay').value,txType:$('#q_tx').value,member:$('#q_member').value,
      createdAt:Date.now()};
    S.records.push(rec); await dbPut('records',rec);
    // 余额由账户期初+流水派生计算，无需在此改动
    // 保存小票图片到 IndexedDB(本地浏览器存储,不上传服务器)
    if(_pendingPhoto){
      try{
        await dbPut('receipts',{recordId:rec.id, blob:_pendingPhoto, type:_pendingPhoto.type||'image/jpeg', createdAt:Date.now()});
      }catch(e){ console.warn('保存小票失败',e); }
    }

    // 关联债务:自动扣本金
    const did=$('#q_debt').value;
    if(did){
      const d=S.debts.find(x=>x.id===did);
      if(d){
        d.paidAmount=(Number(d.paidAmount)||0)+amount;
        d.paidPeriods=(Number(d.paidPeriods)||0)+1;
        if(debtRemaining(d)<=0) d.status='已结清';
        await dbPut('debts',d);
      }
    }
    localStorage.removeItem('fw_draft');
    toast('已保存 '+fmtRM(amount));
    amtInput.setAmount(0); $('#q_note').value=''; $('#q_order').value=''; $('#q_party').value=''; $('#q_debt').value='';
    _pendingPhoto=null; const img=$('#q_img'); if(img&&img.src) URL.revokeObjectURL(img.src); $('#q_preview').style.display='none'; ocrStatus('',false);
  };
  $('#q_reset').onclick=()=>{
    _pendingPhoto=null; const img=$('#q_img'); if(img&&img.src) URL.revokeObjectURL(img.src);
    localStorage.removeItem('fw_draft');V_quick(v);
  };
  // 自动保存草稿
  ['#q_note','#q_order','#q_item','#q_party','#q_member','#q_pay','#q_tx','#q_loc'].forEach(sel=>{
    const el=$(sel); if(!el) return;
    el.addEventListener('change',()=>{
      const cur=JSON.parse(localStorage.getItem('fw_draft')||'{}');
      cur[sel.slice(1).replace('q_','').toLowerCase()]=el.value;
      localStorage.setItem('fw_draft',JSON.stringify(cur));
    });
  });
}

/* ---------- 视图：数据统计 ---------- */
let _charts=[];
function destroyCharts(){_charts.forEach(c=>{try{c.destroy();}catch(e){}});_charts=[];}
function V_stats(v){
  destroyCharts();
  const year=new Date().getFullYear();
  const yr=inRange(flowRecords(),'01-01-'+year,'31-12-'+year);
  const catMap={}; yr.filter(r=>r.dir==='out').forEach(r=>{catMap[r.category]=(catMap[r.category]||0)+r.amount;});
  const catEntries=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const mMap=Array(12).fill(0).map(()=>({i:0,e:0})); yr.forEach(r=>{const m=parseInt(String(r.date).split('-')[1],10);if(m>=1&&m<=12){mMap[m-1][r.dir==='in'?'i':'e']+=r.amount;}});

  // —— KPI 速览:今日 / 本周 / 本月 / 全年 ——
  const today=todayDMY();
  const wk=weekRangeOf(today);
  const mo=monthRangeDMY(new Date().getFullYear(),new Date().getMonth()+1);
  const yrRange={start:'01-01-'+year,end:'31-12-'+year};
  const kpis=[
    ['今日收支',today,today,`📅 ${today}`],
    ['本周收支',wk.start,wk.end,`📆 ${wk.start.slice(0,5)} - ${wk.end.slice(0,5)} · 星期一 起`],
    ['本月收支',mo.start,mo.end,`📊 ${mo.start.slice(0,7)}`],
    ['全年收支汇总',yrRange.start,yrRange.end,`📅 ${year}`],
  ].map(([label,s,e,badge])=>{
    const rs=inRange(flowRecords(),s,e);
    const i=rs.filter(r=>r.dir==='in').reduce((a,r)=>a+r.amount,0);
    const ex=rs.filter(r=>r.dir==='out').reduce((a,r)=>a+r.amount,0);
    return {label,badge,i,ex,bal:i-ex};
  });

  // 支付方式现金流卡片
  const groups={现金:{i:0,e:0},银行:{i:0,e:0},'小资贷款':{i:0,e:0},电子钱包:{i:0,e:0}};
  flowRecords().forEach(r=>{
    const pm=r.payMethod||'';
    if(pm==='现金'){groups['现金'][r.dir==='in'?'i':'e']+=r.amount;}
    else if(pm==='RHB Bank'){groups['银行'][r.dir==='in'?'i':'e']+=r.amount;}
    else if(/paylater/i.test(pm)){groups['小资贷款'].e+=r.amount;} // PayLater 一般是支出
    else if(['Tng Ewallet','Ryt Bank','GX Bank','Boost','Grab Pay','Shopee Pay','支付宝','微信','其他'].includes(pm)){groups['电子钱包'][r.dir==='in'?'i':'e']+=r.amount;}
  });
  // 小资贷款剩余待还本金（来自债务）
  const plRemain=S.debts.filter(isPayLater).reduce((a,d)=>a+debtRemaining(d),0);

  // 成员收支

/* ---------- 视图：预算管理 ---------- */
function V_budget(v){
  v.innerHTML=`
  <div class="card glass">
    <div class="form-grid">
      <div class="field"><label>每日总预算 (RM)</label><input id="b_daily" inputmode="decimal" placeholder="例：80"></div>
      <div class="field"><label>每周总预算 (RM)</label><input id="b_weekly" inputmode="decimal" placeholder="例：500"></div>
      <div class="field"><label>每月总预算 (RM)</label><input id="b_monthly" inputmode="decimal" placeholder="例：2500"></div>
    </div>
    <div class="row" style="margin-top:12px"><button class="primary-btn" id="b_save">保存预算</button></div>
  </div>
  <div class="section-title">🎯 预算执行</div>
  <div id="b_run"></div>
  <div class="section-title">分类预算（专项）</div>
  <div class="card glass">
    <div class="form-grid">
      <div class="field"><label>分类</label><select id="bc_cat">${opt(LIB.expenseCats)}</select></div>
      <div class="field"><label>月度预算 (RM)</label><input id="bc_val" inputmode="decimal" placeholder="例：300"></div>
    </div>
    <div class="row" style="margin-top:12px"><button class="primary-btn" id="bc_add">添加/更新</button></div>
  </div>
  <div class="card glass" style="margin-top:12px" id="bc_list"></div>`;

  const cfg=JSON.parse(localStorage.getItem('fw_budget')||'{}');
  $('#b_daily').value=cfg.daily||''; $('#b_weekly').value=cfg.weekly||''; $('#b_monthly').value=cfg.monthly||'';
  $('#b_save').onclick=()=>{const o={daily:Number($('#b_daily').value)||0,weekly:Number($('#b_weekly').value)||0,monthly:Number($('#b_monthly').value)||0};localStorage.setItem('fw_budget',JSON.stringify(o));V_budget(v);};

  const t=todayDMY(); const wk=weekRangeOf(t); const mo=monthRangeDMY(new Date().getFullYear(),new Date().getMonth()+1);
  const dExp=inRange(flowRecords(),t,t).filter(r=>r.dir==='out').reduce((a,r)=>a+r.amount,0);
  const wExp=inRange(flowRecords(),wk.start,wk.end).filter(r=>r.dir==='out').reduce((a,r)=>a+r.amount,0);
  const mExp=inRange(flowRecords(),mo.start,mo.end).filter(r=>r.dir==='out').reduce((a,r)=>a+r.amount,0);
  const cats=JSON.parse(localStorage.getItem('fw_budget_cat')||'{}');
  $('#b_run').innerHTML=['daily','weekly','monthly'].map(k=>{
    const limit=k==='daily'?cfg.daily:k==='weekly'?cfg.weekly:cfg.monthly;
    const used=k==='daily'?dExp:k==='weekly'?wExp:mExp;
    if(!limit) return '';
    const pct=Math.min(100,Math.round(used/limit*100));
    const over=used>limit;
    return `<div class="card glass" style="margin-bottom:10px">
      <div class="kv"><span class="k">${k==='daily'?'每日':k==='weekly'?'每周':'每月'}总预算</span><span class="v">${fmtRM(used)} / ${fmtRM(limit)}</span></div>
      <div class="bar"><i class="${over?'over':''}" style="width:${pct}%"></i></div>
      <div class="tiny ${over?'warn':'muted'}" style="margin-top:6px;${over?'color:#ff5c5c;font-weight:700':''}">${over?'⚠️ 已超支 '+fmtRM(used-limit)+'（'+(pct-100)+'%）':'已用 '+pct+'%，剩余 '+fmtRM(limit-used)}</div>
    </div>`;
  }).join('')||'<div class="empty">先在上面设置预算</div>';

  $('#bc_add').onclick=()=>{const c=$('#bc_cat').value; const v=Number($('#bc_val').value)||0; cats[c]=v; localStorage.setItem('fw_budget_cat',JSON.stringify(cats));V_budget(v);};
  function renderCatList(){
    const mExpBy={};
    inRange(flowRecords(),mo.start,mo.end).filter(r=>r.dir==='out').forEach(r=>{mExpBy[r.category]=(mExpBy[r.category]||0)+r.amount;});
    $('#bc_list').innerHTML=Object.keys(cats).length?Object.entries(cats).map(([c,lim])=>{
      const used=mExpBy[c]||0; const pct=Math.min(100,Math.round(used/lim*100)); const over=used>lim;
      return `<div class="kv"><span class="k">${esc(c)}</span><span class="v ${over?'warn':''}">${fmtRM(used)} / ${fmtRM(lim)}</span></div>
      <div class="bar" style="margin-bottom:8px"><i class="${over?'over':''}" style="width:${pct}%"></i></div>`;
    }).join(''):'<div class="empty">暂无分类预算</div>';
  }
  renderCatList();
}

/* ---------- 视图：日历 ---------- */
function V_calendar(v){
  const cur=window._calCur||{y:new Date().getFullYear(),m:new Date().getMonth()+1};
  window._calCur=cur;
  v.innerHTML=`
  <div class="card glass">
    <div class="cal-topbar">
      <div class="section-title" style="margin:0;font-size:15px">📅 日历收支统计 <span class="cal-period-badge" id="cal_period_badge">${cur.y} 年 ${cur.m} 月</span></div>
      <div class="seg cal-views" id="calView">
        <button data-v="day">日</button>
        <button data-v="month" class="active">月视图</button>
        <button data-v="year">年视图</button>
      </div>
    </div>
    <div id="cal_stat_kpi" class="cal-stat-kpi"></div>
  </div>
  <div class="cal-head">
    <div class="cal-nav">
      <button class="ghost-btn" id="c_prev">‹ 上月</button>
      <strong id="c_title">${cur.y} 年 ${cur.m} 月</strong>
      <button class="ghost-btn" id="c_next">下月 ›</button>
      <button class="ghost-btn" id="c_today">今天</button>
    </div>
  </div>
  <div id="cal_body"></div>`;
  $('#c_prev').onclick=()=>{cur.m--;if(cur.m<1){cur.m=12;cur.y--;}V_calendar(v);};
  $('#c_next').onclick=()=>{cur.m++;if(cur.m>12){cur.m=1;cur.y++;}V_calendar(v);};
  $('#c_today').onclick=()=>{cur.y=new Date().getFullYear();cur.m=new Date().getMonth()+1;V_calendar(v);};
  let view='month';
  $$('#calView button').forEach(b=>b.onclick=()=>{
    if(b.dataset.v==='day'){dayModal(todayDMY());return;}
    $$('#calView button').forEach(x=>x.classList.toggle('active',x===b));
    view=b.dataset.v; render();
  });
  function dayModal(dmy){
    const list=inRange(flowRecords(),dmy,dmy).sort((a,b)=>(a.createdAt)-(b.createdAt));
    const tot=list.reduce((a,r)=>r.dir==='in'?a+r.amount:a-r.amount,0);
    const body=`<div class="kv"><span class="k">${dmy} 净流</span><span class="v ${tot>=0?'tag-income':'tag-expense'}">${fmtRM(tot)}</span></div>
      <div class="table-wrap" style="margin-top:10px"><table>
      <thead><tr><th>类型</th><th>金额</th><th>分类</th><th>成员</th><th>支付</th><th>备注</th></tr></thead>
      <tbody>${list.length?list.map(r=>`<tr><td class="${r.dir==='in'?'tag-income':'tag-expense'}">${r.dir==='in'?'收入':'支出'}</td><td class="num">${fmtRM(r.amount)}</td><td>${esc(r.category||'')}</td><td>${esc(r.member||'')}</td><td>${esc(r.payMethod||'')}</td><td>${esc(r.note||'')}${r.item?` · 物品：${esc(r.item)}`:''}${r.party?` · 往来：${esc(r.party)}`:''}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">当日无流水</td></tr>'}</tbody>
      </table></div>`;
    showModal('📅 '+dmy+' 当日明细',body);
  }
  function render(){
    const recs=flowRecords();
    // —— 日历收支统计(根据视图范围) ——
    let statRange,statLabel;
    if(view==='year'){
      statRange={start:'01-01-'+cur.y,end:'31-12-'+cur.y};
      statLabel=cur.y+' 年';
    }else{
      statRange=monthRangeDMY(cur.y,cur.m);
      statLabel=cur.y+' 年 '+cur.m+' 月';
    }
    const rs=inRange(recs,statRange.start,statRange.end);
    const sInc=rs.filter(r=>r.dir==='in').reduce((a,r)=>a+r.amount,0);
    const sExp=rs.filter(r=>r.dir==='out').reduce((a,r)=>a+r.amount,0);
    const sBal=sInc-sExp;
    if($('#cal_period_badge')) $('#cal_period_badge').textContent=statLabel;
    $('#cal_stat_kpi').innerHTML=`
      <div class="cards">
        <div class="card glass"><div class="label">收入</div><div class="value income">${fmtRM(sInc)}</div></div>
        <div class="card glass"><div class="label">支出</div><div class="value expense">${fmtRM(sExp)}</div></div>
        <div class="card glass"><div class="label">结余</div><div class="value ${sBal>=0?'':'warn'}">${fmtRM(sBal)}</div></div>
      </div>`;
    $('#c_title').textContent=cur.y+' 年 '+cur.m+' 月';
    if(view==='month'){
      const first=new Date(cur.y,cur.m-1,1).getDay();
      const days=new Date(cur.y,cur.m,0).getDate();
      const cells=[];
      for(let i=0;i<first;i++) cells.push({other:true});
      for(let d=1;d<=days;d++){
        const dmy=pad2(d)+'-'+pad2(cur.m)+'-'+cur.y;
        const list=inRange(recs,dmy,dmy);
        const inc=list.filter(r=>r.dir==='in').reduce((a,r)=>a+r.amount,0);
        const exp=list.filter(r=>r.dir==='out').reduce((a,r)=>a+r.amount,0);
        cells.push({dmy,d,inc,exp,today:dmy===todayDMY()});
      }
      $('#cal_body').innerHTML=`
        <div class="cal-week">${['日','一','二','三','四','五','六'].map(x=>`<div>${x}</div>`).join('')}</div>
        <div class="cal-grid">${cells.map(c=>c.other?`<div class="cal-cell other"></div>`:`<div class="cal-cell ${c.today?'today':''}" data-d="${c.dmy}">
          <div class="d">${c.d}</div>
          <div class="amt">${c.inc?`<span class="i">+${fmtNum(c.inc)}</span>`:''}${c.exp?`<br><span class="e">-${fmtNum(c.exp)}</span>`:''}</div>
        </div>`).join('')}</div>`;
      $$('#cal_body .cal-cell[data-d]').forEach(el=>el.onclick=()=>dayModal(el.dataset.d));
    } else if(view==='year'){
      $('#cal_body').innerHTML=`<div class="cal-year">${Array.from({length:12},(_,i)=>{
        const m=i+1; const mr=monthRangeDMY(cur.y,m);
        const list=inRange(recs,mr.start,mr.end);
        const inc=list.filter(r=>r.dir==='in').reduce((a,r)=>a+r.amount,0);
        const exp=list.filter(r=>r.dir==='out').reduce((a,r)=>a+r.amount,0);
        return `<div class="cal-month" data-m="${m}"><div class="m">${m}月</div><div class="amt">收入 <span class="i">${fmtRM(inc)}</span><br>支出 <span class="e">${fmtRM(exp)}</span></div></div>`;
      }).join('')}</div>`;
      $$('#cal_body .cal-month').forEach(el=>el.onclick=()=>{cur.m=+el.dataset.m;view='month';$$('#calView button').forEach(x=>x.classList.toggle('active',x.dataset.v==='month'));render();});
      $('#c_title').textContent=cur.y+' 年';
    } else if(view==='day'){
      // 日视图（点击某天弹窗）
      $('#cal_body').innerHTML=`<div class="empty">点击上方"日"按钮可查看当日明细弹窗</div>`;
      $('#c_title').textContent=todayDMY();
    }
  }
  render();
}

    try{ const db=await openDB(); const tx=db.transaction('receipts','readwrite'); tx.objectStore('receipts').clear(); await new Promise(r=>{tx.oncomplete=r;}); }catch(e){}
    await loadAll(); alert('导入完成,页面将刷新'); location.reload();
  };

function showLock(){
  $('#lockScreen').classList.remove('hidden');
  $('#lockInput').value=''; $('#lockInput').focus();
  $('#lockHint').textContent='请输入访问密码';
  $('#unlockBtn').onclick=()=>tryUnlock();
  $('#lockInput').onkeydown=e=>{if(e.key==='Enter')tryUnlock();};
  // 生物识别快捷解锁：仅在安全上下文 + 设备支持平台认证器 + 已绑定时显示
  const bioBtn=$('#bioBtn');
  if(bioBtn){
    if(isBioAvailable() && localStorage.getItem('fw_bio')==='1'){
      bioBtn.style.display='block';
      bioBtn.onclick=()=>bioUnlock();
    } else {
      bioBtn.style.display='none';
    }
  }
}
// 设备能力：HTTPS/localhost 且存在平台生物认证器
function isBioAvailable(){
  return !!window.isSecureContext && typeof PublicKeyCredential!=='undefined' &&
    typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable==='function';
}
// base64url 编解码
function bufToB64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64urlToBuf(s){s=s.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(s);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr.buffer;}
// 绑定本地生物识别（仅快捷解锁；不替代主密码）
async function bindBio(){
  if(!isBioAvailable()){toast('当前设备/环境不支持生物识别');return false;}
  const avail=await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(()=>false);
  if(!avail){toast('未检测到可用的指纹/面容模块');return false;}
  try{
    const userId=bufToB64url(crypto.getRandomValues(new Uint8Array(16)));
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const cred=await navigator.credentials.create({publicKey:{
      challenge, rp:{name:'钰琦的记账本'}, user:{id:b64urlToBuf(userId), name:'owner', displayName:'记账本主人'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      // 不强制 platform 附件、residentKey 改为 discouraged：规避 Android Chrome
      // "An Unknown error occurred while talking to the credential manager" 报错
      authenticatorSelection:{ userVerification:'required', residentKey:'discouraged' },
      timeout:60000, attestation:'none'
    }});
    const credId=bufToB64url(cred.rawId);
    localStorage.setItem('fw_bio','1');
    localStorage.setItem('fw_bio_cred', JSON.stringify({id:credId, userId}));
    return true;
  }catch(e){
    console.warn('绑定生物识别失败',e);
    let msg='绑定失败';
    if(e&&e.name==='NotAllowedError') msg='已取消或超时，请重试';
    else if(e&&e.message) msg='绑定失败：'+e.message;
    else if(e&&e.name) msg='绑定失败：'+e.name;
    toast(msg);
    return false;
  }
}
// 生物识别快捷解锁
async function bioUnlock(){
  if(localStorage.getItem('fw_bio')!=='1'){toast('尚未绑定生物识别');return;}
  const saved=JSON.parse(localStorage.getItem('fw_bio_cred')||'{}');
  if(!saved.id){toast('绑定信息缺失，请用密码登录');return;}
  try{
    const cred=await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{type:'public-key', id:b64urlToBuf(saved.id)}],
      userVerification:'required', timeout:60000
    }});
    if(cred){ sessionStorage.removeItem('fw_locked'); $('#lockScreen').classList.add('hidden'); await loadAll(); go('overview'); }
    else { toast('识别未通过，请用密码登录'); }
  }catch(e){ console.warn('生物识别解锁失败',e); toast('指纹/面容验证未通过，请用密码登录'); }
}
async function tryUnlock(){
  const pwd=localStorage.getItem('fw_pwd')||'0000';
  const input=$('#lockInput')?$('#lockInput').value:'';
  if(input===pwd){
    sessionStorage.removeItem('fw_locked');
    $('#lockScreen').classList.add('hidden');
    await loadAll();
    go('overview');
  } else {
    if($('#lockInput')){ $('#lockHint').textContent='密码错误，请重试'; $('#lockInput').select(); }
  }
}
